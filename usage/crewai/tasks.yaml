# Task definitions for Security Buddy Crew

# ---------------------------------------------------------------------------
# Phase 1: Parallel Analysis Tasks
# ---------------------------------------------------------------------------

analyze_sast:
  description: >
    Analyze the source code at /project for security vulnerabilities.
    Read the knowledge base at /knowledge/general/vulnerabilities-and-mitigations/en.md.
    
    CRITICAL PATH RULES:
    - The project root is ALWAYS "/project" — use this exact absolute path.
    - Do NOT use placeholders like [PROJECT_ROOT] or [PROJECT] — they do not exist.
    - Do NOT use relative paths like "app/" or "./app" — always use "/project/app/".
    - When listing a directory, pass the exact absolute path: "/project", "/project/src", etc.
    - When reading a file, pass the exact absolute path: "/project/src/main.py", etc.
    - Do NOT append ":1" or any line numbers to file paths — the tool reads the whole file.
    
    IMPORTANT WORKFLOW:
    1. First, use list_directory to explore "/project" recursively — list all
       subdirectories and files to understand the project structure.
    2. Then, use read_a_files_content to read each source code file (.py, .js, .java,
       .yaml, .json, .ts, .go, .c, .cpp, .rb, .php, etc.) to find vulnerabilities.
    3. Identify injection flaws, broken access control, XSS, insecure deserialization,
       and other static code weaknesses.
    4. Map each finding to CWE, OWASP Top 10, and MITRE ATT&CK.
    
    IMPORTANT: To list files in a directory, read the directory path (e.g. "/project")
    with your list_tool or read_tool — the tool returns a directory listing as text.
  expected_output: >
    A structured list of SAST findings. Each finding MUST contain:
    - CWE identifier (e.g. CWE-79)
    - Severity (Critical/High/Medium/Low)
    - Exact location (file:line)
    - Description of the vulnerability
    - Remediation with before/after code
    - MITRE ATT&CK technique mapping

analyze_sca:
  description: >
    Analyze the project dependencies at {project_path} for known vulnerabilities (CVEs).
    Read the knowledge base at {kb_path}/supply-chain/vulnerabilities-and-mitigations/en.md.
    
    IMPORTANT WORKFLOW:
    1. Use list_directory to explore {project_path} recursively.
    2. Use read_a_files_content to read dependency files (requirements.txt, package.json,
       pom.xml, build.gradle, go.mod, Cargo.toml, etc.).
    3. Identify outdated or vulnerable dependencies and map to CVE IDs.
    4. Suggest safe versions for remediation.
  expected_output: >
    A structured list of SCA findings. Each finding MUST contain:
    - CVE identifier (e.g. CVE-2024-XXXX)
    - Severity (Critical/High/Medium/Low)
    - Affected component and version
    - Fixed version recommendation
    - Description of the vulnerability

analyze_config:
  description: >
    Analyze configuration files at {project_path} for security misconfigurations.
    Read the knowledge base at {kb_path}/infrastructure/container-cloud-security/vulnerabilities-and-mitigations/en.md.
    
    IMPORTANT WORKFLOW:
    1. Use list_directory to explore {project_path} recursively.
    2. Use read_a_files_content to read config files (Dockerfile, docker-compose.yml,
       .env, .yaml, .yml, .toml, CI/CD configs, etc.).
    3. Identify exposed secrets, overly permissive settings, missing security headers,
       and insecure defaults.
  expected_output: >
    A structured list of configuration findings. Each finding MUST contain:
    - CWE identifier (e.g. CWE-200)
    - Severity (Critical/High/Medium/Low)
    - Exact file and line number
    - Description of the misconfiguration
    - Remediation steps

analyze_architecture:
  description: >
    Review the application architecture at {project_path} for security design flaws.
    Read the knowledge base at {kb_path}/threat-modeling/vulnerabilities-and-mitigations/en.md.
    
    IMPORTANT WORKFLOW:
    1. Use list_directory to explore {project_path} recursively.
    2. Use read_a_files_content to read source code files to understand the architecture.
    3. Analyze data flow, trust boundaries, authentication/authorization models,
       and session management.
    4. Apply STRIDE threat modeling methodology.
  expected_output: >
    A structured list of architecture findings. Each finding MUST contain:
    - STRIDE category (Spoofing/Tampering/Repudiation/Info Disclosure/DoS/Elevation)
    - Severity (Critical/High/Medium/Low)
    - Component name
    - Description of the design flaw
    - Recommended architectural change

analyze_ai_ml:
  description: >
    Analyze AI/ML related code at {project_path} for OWASP LLM Top 10 vulnerabilities.
    Read the knowledge base at {kb_path}/ai-based/vulnerabilities-and-mitigations/en.md.
    
    IMPORTANT WORKFLOW:
    1. Use list_directory to explore {project_path} recursively.
    2. Use read_a_files_content to read AI/ML related files.
    3. Identify prompt injection, training data poisoning, model theft,
       sensitive information disclosure, and insecure output handling.
  expected_output: >
    A structured list of AI/ML findings. Each finding MUST contain:
    - OWASP LLM category (LLM01-LLM10)
    - Severity (Critical/High/Medium/Low)
    - Location in code
    - Description of the vulnerability
    - Remediation steps

analyze_crypto:
  description: >
    Analyze cryptographic implementations at {project_path} for weaknesses.
    Read the knowledge base at {kb_path}/cryptography/vulnerabilities-and-mitigations/en.md.
    
    IMPORTANT WORKFLOW:
    1. Use list_directory to explore {project_path} recursively.
    2. Use read_a_files_content to read source code files.
    3. Identify weak algorithms (MD5, SHA1, DES, RC4), improper key management,
       hardcoded secrets, insecure random number generators, and improper TLS configs.
  expected_output: >
    A structured list of cryptography findings. Each finding MUST contain:
    - CWE identifier (e.g. CWE-327)
    - Severity (Critical/High/Medium/Low)
    - Exact file and line number
    - Description of the weakness
    - Recommended algorithm or approach

# ---------------------------------------------------------------------------
# Phase 2: Bug Hunter Task
# ---------------------------------------------------------------------------

hunt_exploit_chains:
  description: >
    Review all findings from the parallel analysis phase and identify exploit chains.
    An exploit chain is a sequence of low/medium severity issues that combine into
    a critical attack path. For each chain, describe the step-by-step attack path,
    technical and business impact, and provide a chain-breaking fix.
  expected_output: >
    A structured list of exploit chains. Each chain MUST contain:
    - Chain ID (CHAIN-001, CHAIN-002, etc.)
    - Severity (Critical/High)
    - Step-by-step attack path
    - Technical impact
    - Business impact
    - Chain-breaking fix

# ---------------------------------------------------------------------------
# Phase 3: Report Generation Task
# ---------------------------------------------------------------------------

generate_report:
  description: >
    Compile all findings and exploit chains into a comprehensive AppSec report.
    Read the knowledge base at {kb_path}/general/reporting/en.md for reporting guidelines.
    Include executive summary, methodology, detailed findings, business impact,
    and prioritized remediation roadmap.
  expected_output: >
    A complete security audit report in markdown format with:
    - Executive summary
    - Methodology
    - Detailed findings with CWE/severity/location/remediation
    - Business impact analysis
    - Prioritized remediation roadmap

# ---------------------------------------------------------------------------
# Phase 4: Fix Task (optional)
# ---------------------------------------------------------------------------

fix_vulnerabilities:
  description: >
    Apply security fixes to the source code at {project_path} based on the
    findings report at {report_path} and developer prompts at {prompts_path}.
    Read the knowledge base at {kb_path} for secure coding guidance.
    For each finding, implement the remediation and generate a diff.
    Do NOT introduce dangerous patterns (eval(), chmod 777, hardcoded secrets).
  expected_output: >
    A list of applied fixes. Each fix MUST contain:
    - Finding ID
    - Whether the fix was applied
    - File changed and lines changed
    - Diff (before/after)
    - Verification status
